<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Primo accesso — FDI Ascolta IX CRM</title>
<link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/theme-fdi.css">
<style>
body{margin:0;background:#f4f7fb;color:#102342;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.topbar{padding:18px 26px;background:#082f6a;color:#fff;border-bottom:4px solid #d3a400}
.topbar strong{font-size:1.18rem}.page{min-height:calc(100vh - 70px);display:grid;place-items:center;padding:24px}
.card{width:min(540px,100%);background:#fff;border:1px solid #dfe6ef;border-radius:20px;box-shadow:0 24px 70px rgba(8,47,106,.13);padding:30px}
h1{margin:0 0 8px;color:#082f6a}.lead{margin:0 0 24px;color:#67758c;line-height:1.55}
label{display:block;font-weight:850;margin:15px 0 6px}input{width:100%;box-sizing:border-box;border:1px solid #dfe6ef;border-radius:12px;padding:13px 14px;font-size:15px}
input:focus{outline:0;border-color:#0b4c99;box-shadow:0 0 0 4px rgba(11,76,153,.12)}
.rules{font-size:.78rem;color:#67758c;line-height:1.55;background:#f4f7fb;padding:12px 14px;border-radius:11px;margin:16px 0}
.btn{width:100%;min-height:46px;border:0;border-radius:12px;background:#082f6a;color:#fff;font-weight:950;cursor:pointer}
.message{margin:0 0 14px;padding:12px;border-radius:11px;background:#fff0f0;color:#b42121;font-weight:800}
</style>
</head>
<body>
<header class="topbar"><strong>FDI ASCOLTA IX CRM</strong></header>
<main class="page"><section class="card">
<h1>Crea la tua password</h1>
<p class="lead">È il tuo primo accesso. Per motivi di sicurezza devi sostituire la password temporanea ricevuta via email.</p>
<div id="message" class="message" hidden></div>
<form id="passwordForm">
<label for="currentPassword">Password temporanea</label>
<input id="currentPassword" type="password" autocomplete="current-password" required>
<label for="newPassword">Nuova password</label>
<input id="newPassword" type="password" autocomplete="new-password" minlength="12" required>
<label for="confirmPassword">Conferma nuova password</label>
<input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required>
<div class="rules">Minimo 12 caratteri, con almeno una lettera maiuscola, una minuscola, un numero e un simbolo.</div>
<button id="saveBtn" class="btn" type="submit">Salva nuova password</button>
</form>
</section></main>
<script src="assets/js/config.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/api.js"></script>
<script>
if(!Auth.requireAuth()) throw new Error("Autenticazione richiesta");
const form=document.getElementById("passwordForm");
const message=document.getElementById("message");
const saveBtn=document.getElementById("saveBtn");
form.addEventListener("submit",async event=>{
  event.preventDefault();message.hidden=true;
  const current=document.getElementById("currentPassword").value;
  const next=document.getElementById("newPassword").value;
  const confirm=document.getElementById("confirmPassword").value;
  if(next!==confirm){message.textContent="Le nuove password non coincidono";message.hidden=false;return}
  saveBtn.disabled=true;saveBtn.textContent="Salvataggio...";
  try{
    const result=await API.changeOwnPassword(current,next);
    if(!result.ok)throw new Error(result.error||"Aggiornamento non riuscito");
    Auth.clearSession();
    alert("Password aggiornata. Ora accedi con la nuova password.");
    location.replace("login.html");
  }catch(error){message.textContent=error.message||"Errore";message.hidden=false}
  finally{saveBtn.disabled=false;saveBtn.textContent="Salva nuova password"}
});
</script>
</body></html>
