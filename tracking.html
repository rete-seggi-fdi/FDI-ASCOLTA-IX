<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Segui pratica</title><link rel="stylesheet" href="assets/css/lite.css?v=500"></head><body><main class="public"><div class="public-head"><h1>Segui la tua pratica</h1><p>Inserisci il codice ricevuto dopo l'invio.</p></div><div class="public-card"><div class="formgrid"><div class="field"><label>Codice pratica o link personale</label><input id="code"></div><div class="field"><label>Email (necessaria con vecchio codice IX-…)</label><input id="email" type="email"></div></div><button class="btn" id="search">Cerca</button><div id="result" style="margin-top:18px"></div></div><p><a href="index.html">← Torna alla home</a></p></main><script src="assets/js/config.js?v=500"></script><script src="assets/js/api.js?v=500"></script><script>
const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
$("search").onclick=async()=>{try{$("result").innerHTML='<div class="empty">Ricerca…</div>';const r=await API.publicReport($("code").value.trim(),$("email").value.trim());const x=r.report;$("result").innerHTML=`<h2>${esc(x.id)}</h2><p><span class="badge">${esc(x.stato)}</span></p><h3>${esc(x.titolo)}</h3><p>${esc(x.descrizione)}</p><p><b>Quartiere:</b> ${esc(x.quartiere)} · <b>Ufficio:</b> ${esc(x.ufficioNome||"—")}</p><hr>${r.timeline.map(t=>`<p><b>${esc(t.titolo)}</b><br><span class="muted">${esc(t.data)}</span><br>${esc(t.descrizione||"")}</p>`).join("")}`}catch(e){$("result").innerHTML=`<div class="notice error">${esc(e.message)}</div>`}};
</script></body></html>
