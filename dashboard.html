<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM FDI Ascolta IX</title><link rel="stylesheet" href="assets/css/lite.css?v=500"></head><body>
<div class="app"><aside class="sidebar"><div class="brand">FDI ASCOLTA IX<small>CRM 5.0 LITE</small></div>
<nav class="nav"><button data-view="home">Dashboard</button><button data-view="pratiche">Pratiche</button><button data-admin data-view="uffici">Uffici</button><button data-admin data-view="utenti">Utenti</button></nav>
<div class="sidebar-foot"><div id="who"></div><button class="btn secondary" id="logout" style="margin-top:10px;width:100%">Esci</button></div></aside>
<main class="main"><div class="top"><div><h1 id="pageTitle">Dashboard</h1><p id="pageSub">Caricamento essenziale, niente richieste duplicate.</p></div><button class="btn secondary" id="refresh">Aggiorna</button></div>
<div id="msg"></div>
<section class="view" id="view-home"><div class="grid4"><div class="kpi"><span>TOTALI</span><strong id="kTotal">—</strong></div><div class="kpi"><span>APERTE</span><strong id="kOpen">—</strong></div><div class="kpi"><span>IN ATTESA</span><strong id="kWait">—</strong></div><div class="kpi"><span>RISOLTE</span><strong id="kDone">—</strong></div></div><div class="card"><h2>Ultime pratiche</h2><div id="latest"></div></div></section>
<section class="view" id="view-pratiche"><div class="card"><div class="toolbar"><input id="search" placeholder="Cerca ID, titolo, quartiere, cittadino..."><select id="status"><option value="">Tutti gli stati</option></select><select id="district"><option value="">Tutti i quartieri</option></select><button class="btn" id="filter">Cerca</button></div><div id="reportTable"></div><div class="pager"><button class="btn secondary" id="prev">← Precedente</button><span id="pageInfo"></span><button class="btn secondary" id="next">Successiva →</button></div></div></section>
<section class="view" id="view-uffici"><div class="card"><h2>Uffici municipali</h2><div id="officeTable"></div></div></section>
<section class="view" id="view-utenti"><div class="card"><div style="display:flex;justify-content:space-between;gap:12px"><h2>Utenti</h2><button class="btn" id="newUser">+ Nuovo utente</button></div><div id="userTable"></div></div></section>
</main></div>
<div class="drawer" id="drawer"><div class="drawer-panel"><div class="drawer-head"><h2 id="detailTitle">Pratica</h2><button class="close" id="closeDrawer">×</button></div><div id="detail"></div></div></div>
<script src="assets/js/config.js?v=500"></script><script src="assets/js/auth.js?v=500"></script><script src="assets/js/api.js?v=500"></script>
<script>
if(!Auth.requireAuth()) throw new Error("auth");
const user=Auth.getUser(), isAdmin=Auth.isAdmin();
document.getElementById("who").textContent=(user.nome||user.email)+" · "+user.ruolo;
document.querySelectorAll("[data-admin]").forEach(x=>x.hidden=!isAdmin);
const $=id=>document.getElementById(id); let page=1,pages=1,meta=null,current=null;
const WORK=["Segnalazione ricevuta","Presa in carico dal Gruppo Consiliare","Assegnata al consigliere","Inviata dal consigliere all’ufficio municipale competente","In attesa di risposta dall’ufficio municipale competente","Risposta ricevuta","In lavorazione","Risolta","Archiviata"];
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function note(t,type=""){ $("msg").innerHTML=t?`<div class="notice ${type}">${esc(t)}</div>`:""; }
function table(items){if(!items.length)return '<div class="empty">Nessuna pratica trovata.</div>';return `<div class="tablewrap"><table class="table"><thead><tr><th>Pratica</th><th>Oggetto</th><th>Quartiere</th><th>Stato</th><th>Referente</th><th>Aggiornata</th></tr></thead><tbody>${items.map(r=>`<tr data-id="${esc(r.id)}"><td><b>${esc(r.id)}</b></td><td>${esc(r.titolo||r.categoria)}</td><td>${esc(r.quartiere)}</td><td><span class="badge">${esc(r.stato)}</span></td><td>${esc(r.referenteNome||"—")}</td><td>${esc(r.ultimoAggiornamento||r.data)}</td></tr>`).join("")}</tbody></table></div>`}
async function loadHome(){note("");$("view-home").classList.add("loading");try{const r=await API.dashboard();$("kTotal").textContent=r.counts.total;$("kOpen").textContent=r.counts.aperte;$("kWait").textContent=r.counts.attesa;$("kDone").textContent=r.counts.risolte;$("latest").innerHTML=table(r.latest);bindRows($("latest"));$("pageSub").textContent=`${r.version} · backend ${r.perfMs} ms`;}catch(e){note(e.message,"error")}finally{$("view-home").classList.remove("loading")}}
async function ensureMeta(){if(meta)return meta;meta=await API.meta();$("status").innerHTML='<option value="">Tutti gli stati</option>'+WORK.map(x=>`<option>${esc(x)}</option>`).join("");$("district").innerHTML='<option value="">Tutti i quartieri</option>'+meta.quartieri.map(x=>`<option>${esc(x.nome)}</option>`).join("");return meta}
async function loadReports(){await ensureMeta();$("reportTable").innerHTML='<div class="empty">Caricamento…</div>';try{const r=await API.reports({page,pageSize:25,query:$("search").value,status:$("status").value,quartiere:$("district").value});pages=r.pages;page=r.page;$("reportTable").innerHTML=table(r.items);$("pageInfo").textContent=`Pagina ${page} di ${pages} · ${r.total} pratiche · ${r.perfMs} ms`;$("prev").disabled=page<=1;$("next").disabled=page>=pages;bindRows($("reportTable"));}catch(e){$("reportTable").innerHTML=`<div class="notice error">${esc(e.message)}</div>`}}
function bindRows(root){root.querySelectorAll("tr[data-id]").forEach(tr=>tr.onclick=()=>openDetail(tr.dataset.id))}
async function openDetail(id){$("drawer").classList.add("open");$("detail").innerHTML='<div class="empty">Caricamento dettaglio…</div>';try{const r=await API.detail(id);current=r.report;renderDetail(r)}catch(e){$("detail").innerHTML=`<div class="notice error">${esc(e.message)}</div>`}}
function renderDetail(r){const x=r.report; $("detailTitle").textContent=x.id+" · "+x.stato;let actions="";
if(!isAdmin){actions=`<div class="actions"><div class="actionbox"><h3>Segna in lavorazione</h3><div class="field"><textarea id="workNote" placeholder="Nota obbligatoria (min. 10 caratteri)"></textarea></div><button class="btn" onclick="startWork()">Segna in lavorazione</button></div><div class="actionbox"><h3>Inoltra all'ufficio</h3><div class="field"><select id="office">${(meta?.uffici||[]).map(o=>`<option value="${esc(o.id)}">${esc(o.ufficio)}</option>`).join("")}</select></div><div class="field"><textarea id="officeMsg" placeholder="Messaggio all'ufficio"></textarea></div><button class="btn" onclick="sendOffice()">Invia all'ufficio</button></div><div class="actionbox"><h3>Risposta ricevuta</h3><div class="field"><textarea id="officeResp" placeholder="Inserisci la risposta ricevuta"></textarea></div><button class="btn" onclick="officeResponse()">Salva risposta</button></div><div class="actionbox"><h3>Conclusione</h3><div class="field"><textarea id="closeNote" placeholder="Note finali"></textarea></div><button class="btn" onclick="resolve()">Segna risolta</button></div></div>`}
else{actions=`<div class="actions"><div class="actionbox"><h3>Assegna consigliere</h3><div class="field"><select id="referent">${(meta?.referenti||[]).map(o=>`<option value="${esc(o.id)}">${esc(o.nome)}</option>`).join("")}</select></div><button class="btn" onclick="assign()">Assegna</button></div></div>`}
$("detail").innerHTML=`<div class="detail-grid"><div class="detail-box"><b>Oggetto</b>${esc(x.titolo)}</div><div class="detail-box"><b>Categoria</b>${esc(x.categoria)}</div><div class="detail-box"><b>Quartiere</b>${esc(x.quartiere)}</div><div class="detail-box"><b>Indirizzo</b>${esc(x.indirizzo)}</div><div class="detail-box"><b>Cittadino</b>${esc(x.nome)}<br>${esc(x.email)}</div><div class="detail-box"><b>Ufficio</b>${esc(x.ufficioNome||"—")}</div></div><div class="card"><h3>Descrizione</h3><div>${esc(x.descrizione)}</div></div>${x.rispostaRicevuta?`<div class="card"><h3>Risposta ricevuta</h3>${esc(x.rispostaRicevuta)}</div>`:""}<div class="card"><h3>Timeline</h3>${r.timeline.map(t=>`<p><b>${esc(t.titolo)}</b><br><span class="muted">${esc(t.data)} · ${esc(t.operatore||"")}</span><br>${esc(t.descrizione||"")}</p>`).join("")||'<span class="muted">Nessun evento</span>'}</div>${actions}`}
async function mutate(fn){try{await fn();note("Operazione completata.","success");$("drawer").classList.remove("open");await loadReports();await loadHome()}catch(e){alert(e.message)}}
window.startWork=()=>{const n=$("workNote").value.trim();if(n.length<10)return alert("Inserisci una nota di almeno 10 caratteri.");mutate(()=>API.startWork(current.id,n))}
window.sendOffice=()=>{const m=$("officeMsg").value.trim();if(m.length<10)return alert("Inserisci un messaggio di almeno 10 caratteri.");mutate(()=>API.sendOffice(current.id,$("office").value,m))}
window.officeResponse=()=>{const r=$("officeResp").value.trim();if(r.length<10)return alert("Inserisci la risposta ricevuta.");mutate(()=>API.officeResponse(current.id,r))}
window.resolve=()=>{const n=$("closeNote").value.trim();if(n.length<10)return alert("Inserisci le note finali.");mutate(()=>API.closeReport(current.id,"Risolta",n,false))}
window.assign=()=>mutate(()=>API.assign(current.id,$("referent").value))
async function loadOffices(){await ensureMeta();$("officeTable").innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>Ufficio</th><th>Settore</th><th>Email</th><th>Telefono</th></tr></thead><tbody>${meta.uffici.map(o=>`<tr><td><b>${esc(o.ufficio)}</b></td><td>${esc(o.settore)}</td><td>${esc(o.email)}</td><td>${esc(o.telefono)}</td></tr>`).join("")}</tbody></table></div>`}
async function loadUsers(){const r=await API.users();$("userTable").innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>Nome</th><th>Email</th><th>Ruolo</th><th>Stato</th><th></th></tr></thead><tbody>${r.users.map(u=>`<tr><td>${esc(u.nome)}</td><td>${esc(u.email)}</td><td>${esc(u.ruolo)}</td><td>${u.attivo?"Attivo":"Disattivo"}</td><td><button class="btn secondary" onclick="toggleUser('${esc(u.id)}',${!u.attivo})">${u.attivo?"Disattiva":"Attiva"}</button></td></tr>`).join("")}</tbody></table></div>`}
window.toggleUser=(id,active)=>mutate(()=>API.setUserActive(id,active).then(loadUsers))
$("newUser").onclick=async()=>{const nome=prompt("Nome e cognome");if(!nome)return;const email=prompt("Email");if(!email)return;const ruolo=prompt("Ruolo: Amministratore oppure Consigliere","Consigliere");if(!ruolo)return;try{await API.saveUser({nome,email,ruolo,attivo:true});alert("Utente creato. Password temporanea inviata via email.");await loadUsers()}catch(e){alert(e.message)}}
async function show(name){document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===name));$("view-"+name).classList.add("active");$("pageTitle").textContent={home:"Dashboard",pratiche:isAdmin?"Pratiche":"Le mie pratiche",uffici:"Uffici",utenti:"Utenti"}[name];location.hash=name==="home"?"":name;if(name==="home")loadHome();if(name==="pratiche"){page=1;loadReports()}if(name==="uffici")loadOffices();if(name==="utenti")loadUsers()}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>show(b.dataset.view));$("filter").onclick=()=>{page=1;loadReports()};$("search").onkeydown=e=>{if(e.key==="Enter"){$("filter").click()}};$("prev").onclick=()=>{page--;loadReports()};$("next").onclick=()=>{page++;loadReports()};$("closeDrawer").onclick=()=>{$("drawer").classList.remove("open")};$("logout").onclick=()=>Auth.logout();$("refresh").onclick=()=>{meta=null;show((location.hash||"#home").slice(1)||"home")};
ensureMeta().catch(()=>{}).finally(()=>show((location.hash||"#home").slice(1)||"home"));
</script></body></html>
