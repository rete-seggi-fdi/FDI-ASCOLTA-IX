<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invia segnalazione</title><link rel="stylesheet" href="assets/css/lite.css?v=500"></head><body><main class="public"><div class="public-head"><h1>Invia una segnalazione</h1><p>Municipio IX Roma</p></div><div class="public-card"><div id="message"></div><form id="form"><div class="formgrid"><div class="field"><label>Nome e cognome</label><input id="nome" required></div><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Telefono</label><input id="telefono"></div><div class="field"><label>Quartiere</label><select id="quartiere" required><option>Caricamento…</option></select></div><div class="field"><label>Categoria</label><select id="categoria" required></select></div><div class="field"><label>Priorità</label><select id="priorita"></select></div><div class="field span2"><label>Titolo</label><input id="titolo" required></div><div class="field span2"><label>Indirizzo</label><input id="indirizzo" required></div><div class="field span2"><label>Descrizione</label><textarea id="descrizione" required></textarea></div><div style="display:none"><input id="website" tabindex="-1" autocomplete="off"></div></div><button class="btn" id="send">Invia segnalazione</button></form></div><p><a href="index.html">← Torna alla home</a></p></main><script src="assets/js/config.js?v=500"></script><script src="assets/js/api.js?v=500"></script><script>
const $=id=>document.getElementById(id), esc=v=>String(v??"").replace(/[&<>]/g,"");
(async()=>{try{const b=await API.publicBootstrap();$("quartiere").innerHTML='<option value="">Seleziona quartiere</option>'+b.quartieri.map(q=>`<option>${q.nome}</option>`).join("");$("categoria").innerHTML=b.categories.map(x=>`<option>${x}</option>`).join("");$("priorita").innerHTML=b.priorities.map(x=>`<option>${x}</option>`).join("")}catch(e){$("message").innerHTML=`<div class="notice error">Impossibile caricare i dati: ${esc(e.message)}</div>`}})();
$("form").onsubmit=async e=>{e.preventDefault();$("send").disabled=true;try{const data={nome:$("nome").value,email:$("email").value,telefono:$("telefono").value,quartiere:$("quartiere").value,categoria:$("categoria").value,priorita:$("priorita").value,titolo:$("titolo").value,indirizzo:$("indirizzo").value,descrizione:$("descrizione").value,website:$("website").value,clientId:localStorage.getItem(CONFIG.CLIENT_ID_KEY)||("c-"+Date.now())};localStorage.setItem(CONFIG.CLIENT_ID_KEY,data.clientId);const r=await API.createReport(data);$("message").innerHTML=`<div class="notice success"><b>Segnalazione inviata.</b><br>Codice: ${esc(r.id||r.reportId||"")}</div>`;$("form").reset()}catch(err){$("message").innerHTML=`<div class="notice error">${esc(err.message)}</div>`}finally{$("send").disabled=false}};
</script></body></html>
